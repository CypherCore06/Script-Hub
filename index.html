<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Script Loadstring Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 10px;
        }
        .app-wrapper {
            width: 100%;
            max-width: 650px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            margin: auto;
        }
        .app-header {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            padding: 22px 24px;
            text-align: center;
            position: relative;
        }
        .app-header h2 { font-size: 20px; font-weight: 700; color: #ffffff; }
        .app-header p { font-size: 13px; color: #e0e7ff; margin-top: 4px; }
        .settings-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .app-body { padding: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px; color: #9ca3af; text-transform: uppercase; }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus, textarea:focus { border-color: #6366f1; }
        textarea { resize: vertical; font-family: monospace; min-height: 120px; }
        .token-section {
            background: #1f2937;
            border: 1px dashed #374151;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }
        .token-section.active { display: block !important; }
        .btn-inline {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-save { background: #6366f1; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .result-box {
            margin-top: 24px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 16px;
            display: none;
        }
        .result-box.active { display: block; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-copy { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        pre { background-color: #030712; padding: 14px; border-radius: 8px; border: 1px solid #374151; overflow-x: auto; word-break: break-all; font-family: monospace; font-size: 13px; color: #38bdf8; }
        .token-status { font-size: 12px; color: #10b981; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="app-header">
        <h2>Script Loadstring Generator</h2>
        <p>Pro Key System & Auto-Encryption Hub</p>
        <button class="settings-icon" onclick="toggleTokenSettings()">⚙️ API Settings</button>
    </div>
    
    <div class="app-body">
        <div class="token-section" id="tokenSection">
            <label for="githubToken">GitHub Token (Classic/PAT)</label>
            <input type="password" id="githubToken" placeholder="ghp_... or github_pat_..." style="margin-bottom: 12px;">
            
            <label for="lootLabsApi">LootLabs Target Base Link</label>
            <input type="text" id="lootLabsApi" placeholder="https://loot-link.com/s?your_id_here">
            
            <div class="btn-inline">
                <button class="btn-save" onclick="saveCredentials()">Save Credentials</button>
                <button class="btn-delete" onclick="deleteCredentials()">Clear All</button>
            </div>
        </div>

        <div class="token-status" id="tokenStatus">✅ GitHub & LootLabs link securely stored.</div>

        <div class="form-group">
            <label for="gameName">Game Name</label>
            <input type="text" id="gameName" placeholder="e.g. Voryzen Hub">
        </div>

        <div class="form-group">
            <label for="features">Features (Comma Separated)</label>
            <input type="text" id="features" placeholder="Auto Farm, ESP, Teleport">
        </div>

        <div class="form-group">
            <label for="luaCode">Raw Lua Code</label>
            <textarea id="luaCode" placeholder="print('Paste your raw script here...')"></textarea>
        </div>

        <button class="btn-generate" onclick="generateLoadstring()">Generate Pro Key-System Loadstring</button>

        <div class="result-box" id="resultBox">
            <div class="result-header">
                <label style="margin:0; color:#38bdf8;">Generated Loadstring:</label>
                <button class="btn-copy" onclick="copyToClipboard()">Copy Loadstring</button>
            </div>
            <pre id="outputString">Processing...</pre>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedToken = localStorage.getItem('saved_gh_token');
        const savedApi = localStorage.getItem('saved_loot_api');
        
        if (savedToken && savedApi) {
            document.getElementById('tokenStatus').style.display = 'block';
            document.getElementById('githubToken').value = savedToken;
            document.getElementById('lootLabsApi').value = savedApi;
        } else {
            document.getElementById('tokenSection').classList.add('active');
        }
    };

    function toggleTokenSettings() {
        const section = document.getElementById('tokenSection');
        section.classList.toggle('active');
    }

    function saveCredentials() {
        const token = document.getElementById('githubToken').value.trim();
        const api = document.getElementById('lootLabsApi').value.trim();
        
        if (!token || !api) {
            alert("Please fill in both fields!");
            return;
        }

        localStorage.setItem('saved_gh_token', token);
        localStorage.setItem('saved_loot_api', api);
        
        document.getElementById('tokenStatus').style.display = 'block';
        document.getElementById('tokenSection').classList.remove('active');
        alert("Credentials saved securely!");
    }

    function deleteCredentials() {
        localStorage.removeItem('saved_gh_token');
        localStorage.removeItem('saved_loot_api');
        document.getElementById('githubToken').value = '';
        document.getElementById('lootLabsApi').value = '';
        document.getElementById('tokenStatus').style.display = 'none';
        document.getElementById('tokenSection').classList.add('active');
        alert("Credentials cleared!");
    }

    async function generateLoadstring() {
        const token = localStorage.getItem('saved_gh_token') || document.getElementById('githubToken').value.trim();
        const lootLabsBase = localStorage.getItem('saved_loot_api') || document.getElementById('lootLabsApi').value.trim();
        const game = document.getElementById('gameName').value.trim();
        const features = document.getElementById(/features/).value.trim();
        const code = document.getElementById('luaCode').value.trim();
        
        const resultBox = document.getElementById('resultBox');
        const outputString = document.getElementById('outputString');

        if (!token || !lootLabsBase) {
            alert("Please configure GitHub Token and LootLabs link in settings first!");
            document.getElementById('tokenSection').classList.add('active');
            return;
        }
        if (!game || !code) {
            alert("Please fill in Game Name and Lua Code!");
            return;
        }

        resultBox.classList.add('active');
        outputString.innerText = "1. Creating Gist with Pro Key System UI...";
        resultBox.scrollIntoView({ behavior: 'smooth' });

        try {
            const filename = `${game.toLowerCase().replace(/[^a-z0-9]/g, '_')}_hub.lua`;
            let encodedPayload = btoa(unescape(encodeURIComponent(code)));

            // Professional Lua Script containing blocking Key UI & Verification
            let proScriptContent = `
-- // ${game} - Pro Key System & Secured Loader
local Players = game:GetService("Players")
local CoreGui = game:GetService("CoreGui")
local Player = Players.LocalPlayer

local KEY_LINK = "${lootLabsBase}";
local VALID_KEY = "VORYZEN-2026-KEY"; -- You can change or integrate dynamic check

if CoreGui:FindFirstChild("VoryzenKeyUI") then
    CoreGui.VoryzenKeyUI:Destroy()
end

local ScreenGui = Instance.new("ScreenGui")
ScreenGui.Name = "VoryzenKeyUI"
ScreenGui.Parent = CoreGui
ScreenGui.ZIndexBehavior = Enum.ZIndexBehavior.Sibling

local MainFrame = Instance.new("Frame")
MainFrame.Size = UDim2.new(0, 380, 0, 220)
MainFrame.Position = UDim2.new(0.5, -190, 0.5, -110)
MainFrame.BackgroundColor3 = Color3.fromRGB(17, 24, 39)
MainFrame.BorderSizePixel = 0
MainFrame.Parent = ScreenGui

local UICorner = Instance.new("UICorner")
UICorner.CornerRadius = UDim.new(0, 12)
UICorner.Parent = MainFrame

local Title = Instance.new("TextLabel")
Title.Size = UDim2.new(1, 0, 0, 45)
Title.BackgroundTransparency = 1
Title.Text = "${game} - Key System"
Title.TextColor3 = Color3.fromRGB(255, 255, 255)
Title.TextSize = 16
Title.Font = Enum.Font.GothamBold
Title.Parent = MainFrame

local GetKeyBtn = Instance.new("TextButton")
GetKeyBtn.Size = UDim2.new(0.9, 0, 0, 40)
GetKeyBtn.Position = UDim2.new(0.05, 0, 0, 55)
GetKeyBtn.BackgroundColor3 = Color3.fromRGB(99, 102, 241)
GetKeyBtn.TextColor3 = Color3.fromRGB(255, 255, 255)
GetKeyBtn.Text = "Get Key (Copy Link)"
GetKeyBtn.TextSize.Font = Enum.Font.GothamSemibold
GetKeyBtn.Font = Enum.Font.GothamSemibold
GetKeyBtn.Parent = MainFrame
Instance.new("UICorner", GetKeyBtn).CornerRadius = UDim.new(0, 8)

GetKeyBtn.MouseButton1Click:Connect(function()
    if setclipboard then
        setclipboard(KEY_LINK)
        GetKeyBtn.Text = "Copied Link to Clipboard!"
    end
end)

local KeyBox = Instance.new("TextBox")
KeyBox.Size = UDim2.new(0.9, 0, 0, 40)
KeyBox.Position = UDim2.new(0.05, 0, 0, 105)
KeyBox.BackgroundColor3 = Color3.fromRGB(31, 41, 55)
KeyBox.TextColor3 = Color3.fromRGB(255, 255, 255)
KeyBox.PlaceholderText = "Enter your key here..."
KeyBox.Text = ""
KeyBox.TextSize = 14
KeyBox.Font = Enum.Font.Gotham
KeyBox.Parent = MainFrame
Instance.new("UICorner", KeyBox).CornerRadius = UDim.new(0, 8)

local VerifyBtn = Instance.new("TextButton")
VerifyBtn.Size = UDim2.new(0.9, 0, 0, 40)
VerifyBtn.Position = UDim2.new(0.05, 0, 0, 155)
VerifyBtn.BackgroundColor3 = Color3.fromRGB(16, 185, 129)
VerifyBtn.TextColor3 = Color3.fromRGB(255, 255, 255)
VerifyBtn.Text = "Verify Key & Launch Hub"
VerifyBtn.Font = Enum.Font.GothamSemibold
VerifyBtn.Parent = MainFrame
Instance.new("UICorner", VerifyBtn).CornerRadius = UDim.new(0, 8)

VerifyBtn.MouseButton1Click:Connect(function()
    if KeyBox.Text == VALID_KEY or KeyBox.Text ~= "" then
        ScreenGui:Destroy()
        -- Decrypt and Execute Payload
        local _payload = "${encodedPayload}";
        local _decoded = (base64_decode or function(v) return v end)(_payload);
        loadstring(_decoded)();
    else
        VerifyBtn.Text = "Invalid Key! Try Again."
    end
end)
`;

            // Step 1: Create Gist
            const gistResponse = await fetch('https://api.github.com/gists', {
                method: 'POST',
                    headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    description: `Pro Script Hub for ${game}`,
                    public: true,
                    files: {
                        [filename]: { content: proScriptContent }
                    }
                })
            });

            const gistData = await gistResponse.json();
            if (!gistResponse.ok || !gistData.files) {
                throw new Error("GitHub Gist Error: " + (gistData.message || "Invalid Token"));
            }

            const rawGistUrl = gistData.files[filename].raw_url;
            outputString.innerText = `loadstring(game:HttpGet("${rawGistUrl}"))()`;

        } catch (error) {
            outputString.innerText = "Error: " + error.message;
        }
    }

    function copyToClipboard() {
        const textToCopy = document.getElementById('outputString').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("Loadstring copied to clipboard successfully!");
        });
    }
</script>

</body>
</html>
